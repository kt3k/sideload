name: iOS app

# Builds the Sideload iOS app (ios/SPEC.md) as an unsigned IPA. On every push
# to main the IPA is published to the `sideload-app` pre-release, where
# `sideload install -l` downloads it (SPEC.md 7.8).
on:
  push:
    paths:
      - "ios/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Sideload.ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Test the core
        run: cargo test -p sideload-ios-core

      - name: Build the core
        run: ios/build-core.sh

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app
        run: |
          xcodebuild -project ios/Sideload.xcodeproj -target Sideload \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/ios/build/xcode" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package
        run: |
          set -euo pipefail
          rm -rf ios/build/ipa && mkdir -p ios/build/ipa/Payload
          cp -R ios/build/xcode/Release-iphoneos/Sideload.app ios/build/ipa/Payload/
          (cd ios/build/ipa && zip -qry ../../../Sideload.ipa Payload)
          shasum -a 256 Sideload.ipa > Sideload.ipa.sha256
          unzip -l Sideload.ipa | tail -n 3
          plutil -p ios/build/ipa/Payload/Sideload.app/Info.plist | grep -E 'CFBundle(Identifier|ShortVersionString|Executable)'

      - uses: actions/upload-artifact@v4
        with:
          name: Sideload.ipa
          path: |
            Sideload.ipa
            Sideload.ipa.sha256
          if-no-files-found: error

  # Rolling pre-release `sideload-app`: the tag is moved to the built commit
  # and the assets are replaced. It is a pre-release and never "latest", so
  # releases/latest (install.sh, Homebrew) keeps pointing at the CLI.
  publish:
    name: Publish to the sideload-app release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: publish-sideload-app
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: sideload-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sideload.ipa

      - name: Publish
        run: |
          set -euo pipefail
          sha256sum -c Sideload.ipa.sha256
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' ios/project.yml | head -n 1)
          title="Sideload iOS app ${version}"
          notes=$(printf '%s\n\n%s\n\n%s\n' \
            "The Sideload iOS app (ios/SPEC.md) ${version}, built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d)." \
            "Install it with \`sideload install -l\` (signs it with your Apple ID and puts this computer's pairing file into it)." \
            "This pre-release is replaced on every push to main. Not yet validated on a real device.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$TAG" --title "$title" --notes "$notes" --prerelease --latest=false
            gh release upload "$TAG" Sideload.ipa Sideload.ipa.sha256 --clobber
          else
            gh release create "$TAG" Sideload.ipa Sideload.ipa.sha256 \
              --target "$GITHUB_SHA" --title "$title" --notes "$notes" \
              --prerelease --latest=false
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '"\(.tagName) prerelease=\(.isPrerelease) assets=\([.assets[].name] | join(","))"'
