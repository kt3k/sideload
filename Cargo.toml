[package]
name = "sideload"
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
description = "Sideload iOS apps onto a device with a free or paid Apple developer account"
repository = "https://github.com/kt3k/sideload"
license = "MIT"

# Dependency budget: see docs/ARCHITECTURE.md. Add a crate only when the
# module that needs it is implemented, and keep the transitive count small.
[dependencies]
aes = "0.8"
lexopt = "0.3"
libc = "0.2"
miniz_oxide = "0.9.1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
ring = "0.17"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
